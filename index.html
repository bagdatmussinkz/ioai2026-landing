<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IOAI 2026 — International Olympiad in Artificial Intelligence | Astana, Kazakhstan</title>
<meta name="description" content="3rd International Olympiad in Artificial Intelligence. August 2-8, 2026. Astana, Kazakhstan. Register now for the world's newest science olympiad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:rgba(102,126,234,0.4)}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0a0e1a}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px}

/* Animations */
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-110vh) scale(0.5);opacity:0}}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(10px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* Particle */
.particle{position:absolute;border-radius:50%;animation:floatUp linear infinite}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 32px;height:80px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:18px;letter-spacing:-0.5px}
.nav-logo{display:flex;align-items:center;gap:10px;margin:0;cursor:pointer}
.nav-logo-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.nav-links{display:flex;align-items:center;gap:16px;list-style:none}
.nav-link{background:none;border:none;cursor:pointer;font-size:14px;color:rgba(255,255,255,0.7);transition:color 0.2s;font-weight:600}
.nav-link:hover{color:#fff}
.btn-primary{padding:10px 20px;border-radius:8px;background:linear-gradient(135deg, #667eea, #764ba2);border:none;color:#fff;cursor:pointer;font-weight:700;font-size:14px;transition:transform 0.2s;}
.btn-primary:hover{transform:translateY(-2px)}
.btn-lang{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;transition:color 0.2s}
.btn-lang:hover{color:#fff}

/* Hero */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 16px;position:relative;background:linear-gradient(180deg, rgba(10,14,26,1) 0%, rgba(20,25,50,0.8) 100%)}
.hero-content{max-width:900px;z-index:2;position:relative}
.hero-title{font-size:72px;font-weight:900;background:linear-gradient(135deg, #fff, #a5b4fc, #c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px}
.hero-meta{display:flex;align-items:center;justify-content:center;gap:32px;margin-bottom:32px;flex-wrap:wrap;color:rgba(255,255,255,0.7)}
.hero-buttons{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:48px;flex-wrap:wrap}
.btn-hero{padding:14px 32px;border-radius:12px;background:linear-gradient(135deg, #667eea, #764ba2);border:none;color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:transform 0.2s;}
.btn-hero:hover{transform:translateY(-4px)}
.btn-hero-outline{padding:14px 32px;border-radius:12px;background:transparent;border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-hero-outline:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.3)}
.scroll-hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);cursor:pointer;animation:bounce 2s infinite}

/* Section */
.section{max-width:1200px;margin:0 auto;padding:0 32px}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(102,126,234,0.1);border:1px solid rgba(102,126,234,0.3);border-radius:24px;padding:6px 12px;margin-bottom:24px;font-size:12px;font-weight:700;color:#667eea;text-transform:uppercase;letter-spacing:0.5px}
.section-title{font-size:48px;font-weight:900;margin-bottom:48px}

/* About */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:16px;margin-top:48px}
.stat-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;text-align:center}
.stat-val{font-size:36px;font-weight:900;color:#667eea;margin-bottom:8px}
.stat-label{font-size:14px;color:rgba(255,255,255,0.6)}

/* Contests */
.card{background:linear-gradient(135deg, rgba(102,126,234,0.05), rgba(118,75,162,0.05));border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:32px;margin-bottom:24px}
.card-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg, #667eea, #764ba2);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.card h3{font-size:20px;font-weight:700;margin-bottom:12px}
.card p{color:rgba(255,255,255,0.7);font-size:15px;line-height:1.6}

/* Schedule */
.schedule-item{display:flex;gap:32px;padding:24px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
.schedule-item:last-child{border-bottom:none}
.schedule-date{font-weight:700;font-size:14px;color:rgba(255,255,255,0.5);min-width:100px}
.schedule-item div:last-child{flex:1}
.schedule-item h3{font-weight:700;font-size:16px;margin-bottom:2px}
.schedule-item p{font-size:14px;color:rgba(255,255,255,0.5)}

/* Venue */
.feature-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 16px;margin-right:12px;margin-bottom:12px;font-size:14px}
.feature-chip svg{width:20px;height:20px;color:#667eea}

/* Register */
.register-section{background:rgba(102,126,234,0.05)}
.role-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:16px;margin-bottom:48px}
.role-card{background:rgba(255,255,255,0.02);border:2px solid rgba(255,255,255,0.1);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s}
.role-card:hover{border-color:rgba(102,126,234,0.5);background:rgba(102,126,234,0.08)}
.role-card.active{border-color:#667eea;background:rgba(102,126,234,0.15)}
.role-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg, #667eea, #764ba2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.role-label{font-weight:700;font-size:16px;margin-bottom:8px}
.role-desc{font-size:13px;color:rgba(255,255,255,0.6)}

/* Form */
.form-box{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:48px;max-width:600px;margin:0 auto}
.form-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:16px;margin-bottom:16px}
.form-grid-2{display:grid;grid-template-columns:repeat(2, 1fr);gap:16px;margin-bottom:16px}
.form-grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.form-grid-3{display:grid;grid-template-columns:repeat(3, 1fr);gap:16px;margin-bottom:16px}
.form-grid > div{display:flex;flex-direction:column}
.form-grid-2 > div{display:flex;flex-direction:column}
.form-grid-2-1 > div{display:flex;flex-direction:column}
.form-grid-3 > div{display:flex;flex-direction:column}
.form-label{font-size:15px;font-weight:700;margin-bottom:8px;color:rgba(255,255,255,0.8)}
.form-input{padding:12px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);color:#fff;font-size:14px;transition:all 0.2s}
.form-input:focus{outline:none;border-color:rgba(102,126,234,0.5);background:rgba(102,126,234,0.08)}
.form-input.error{border-color:#ef4444;background:rgba(239,68,68,0.08)}
.form-input::placeholder{color:rgba(255,255,255,0.4)}
.btn-submit{padding:12px 32px;border-radius:10px;background:linear-gradient(135deg, #667eea, #764ba2);border:none;color:#fff;font-weight:600;font-size:15px;cursor:pointer;width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 0.2s}
.btn-submit:hover:not(:disabled){transform:translateY(-2px)}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed}

/* Success */
.success-box{text-align:center;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:12px;padding:48px}
.success-box svg{margin:0 auto 24px}
.reg-id{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:16px;font-family:monospace;font-size:14px;margin:24px 0;word-break:break-all}

/* Error */
.error-box{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:12px;padding:16px;margin-bottom:24px;text-align:center;color:#ef4444;font-weight:600}

/* Spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite}

/* Footer */
.footer{background:rgba(10,14,26,0.95);border-top:1px solid rgba(255,255,255,0.08);padding:64px 32px;margin-top:120px}
.footer-inner{max-width:1200px;margin:0 auto}
.footer-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:48px;margin-bottom:48px}
.footer-grid > div:first-child{grid-column:1/2}
.footer-grid > div:nth-child(2){grid-column:2/3}
.footer-grid > div:nth-child(3){grid-column:3/4}
.footer-grid h4{font-weight:700;font-size:14px;margin-bottom:16px;color:rgba(255,255,255,0.8)}
.footer-grid a{color:rgba(255,255,255,0.5);font-size:14px;display:block;margin-bottom:10px;transition:color 0.2s}
.footer-grid a:hover{color:#fff}
.social-link{display:inline-block;margin-right:12px}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.08);padding-top:24px;text-align:center;color:rgba(255,255,255,0.5);font-size:14px}

/* Responsive */
@media(max-width:768px){
  .hero-title{font-size:48px}
  .section-title{font-size:32px}
  .form-grid,.form-grid-2,.form-grid-3{grid-template-columns:1fr}
  .form-grid-2-1{grid-template-columns:1fr}
  .hero-meta{gap:16px}
  .footer-grid{grid-template-columns:1fr}
  .footer-grid > div{grid-column:auto}
}
</style>
</head>
